<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/vedya-logo.png" />
    <link rel="apple-touch-icon" href="/vedya-logo.png" />
    <title>Vedya | Forms your audience actually finishes</title>
    <meta
      name="description"
      content="Design a beautiful form, publish it to a shareable link, and watch responses roll in. Free to start, no credit card required."

    <meta name="theme-color" content="#047857" />

         crawlers don't run JS, so a shared form link previews as Vedya, not the
         form. ponytail: per-form previews need an edge function that injects
         the form's title — add when shared links matter for growth. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vedya" />
    <meta
      property="og:title"
      content="Vedya | Forms your audience actually finishes"
    />
    <meta
      property="og:description"
      content="Design a beautiful form, publish it to a shareable link, and watch responses roll in. Free to start."
    />
    <meta property="og:image" content="https://vedya.app/vedya-logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
