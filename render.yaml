# Render Blueprint for the Fastify API (backend/).
# The frontend is deployed separately on Vercel — this file only covers the API.
#
# Production today is the `vedya-api-sg` service, created by hand (not from this
# blueprint) with exactly these settings. This file is its reference: to rebuild
# from scratch, create a Blueprint instance from it, then set every
# `sync: false` secret in the dashboard and point the api.vedya.app custom
# domain at the service (Settings → Custom Domains).
#
# Singapore, next to the Neon "Vedya SG" database (ap-southeast-1): the API and
# DB must share a region, or every query pays a cross-region round trip.
services:
  - type: web
    name: vedya-api-sg
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # Render uses corepack + the packageManager field in package.json for pnpm.
    buildCommand: pnpm install --frozen-lockfile
    # Migrations run first on every start. They're idempotent (no-op if already applied).
    startCommand: pnpm migrate && pnpm start
    # DB-free route, so health checks don't keep Neon from scaling to zero.
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Neon "Vedya SG" pooled connection string — set in the dashboard, never commit.
      - key: DATABASE_URL
        sync: false
      # Exact origin of the deployed frontend, e.g. https://vedya.app
      - key: CORS_ORIGIN
        sync: false
      # OpenAI key for AI form generation — set in the dashboard, never commit.
      # Until set, the generate endpoint returns 503 and the rest of the API works.
      - key: OPENAI_API_KEY
        sync: false
      # Cloudflare Turnstile secret for the public-submit bot check. Until set,
      # submissions are accepted without it.
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Resend API key (sending access, vedya.app) for verification, password
      # reset and response emails. Until set, emails are only logged.
      - key: RESEND_API_KEY
        sync: false
